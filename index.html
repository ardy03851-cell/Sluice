<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spaceship Flight Sim</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      touch-action: none;
      user-select: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #hud-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ffff;
      font-family: monospace;
      font-size: 24px;
      z-index: 3;
      text-shadow: 0 0 10px #00ffff;
    }
  </style>
  <script type="importmap">
    {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

  <div id="game-container">
    <div id="loading">INITIALIZING SYSTEMS...</div>
    <canvas id="webgl-canvas"></canvas>
    <canvas id="hud-canvas"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- 1. SETUP & VARIABLES ---
    const webglCanvas = document.getElementById('webgl-canvas');
    const hudCanvas = document.getElementById('hud-canvas');
    const hudCtx = hudCanvas.getContext('2d');
    const loadingEl = document.getElementById('loading');

    let scene, camera, renderer, clock;
    let shipGroup;
    
    // Flight Dynamics
    let pitch = 0, yaw = 0, roll = 0;
    let targetPitch = 0, targetYaw = 0, targetRoll = 0;
    
    // Game State for HUD
    let gameState = {
        speed: 100,
        throttle: 75,
        health: 87,
        ammo: 1600
    };

    // Input
    const input = { x: 0, y: 0, isTouching: false, startX: 0, startY: 0 };

    // Terrain
    const CHUNK_SIZE = 1500;
    const VIEW_DISTANCE = 3;
    const chunks = new Map();
    let terrainMaterial;

    // --- 2. INITIALIZATION ---
    function init() {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050a15, 0.0004);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 15000);
        
        renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        clock = new THREE.Clock();

        // Lighting for the terrain
        const ambientLight = new THREE.AmbientLight(0x334455, 2.0);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(1000, 2000, 500);
        scene.add(dirLight);

        shipGroup = new THREE.Group();
        shipGroup.position.set(0, 300, 0);
        scene.add(shipGroup);

        // Terrain Material
        terrainMaterial = new THREE.MeshStandardMaterial({
            color: 0x112233,
            emissive: 0x001122,
            wireframe: false,
            flatShading: true,
            roughness: 0.9,
            metalness: 0.1
        });

        loadShipModel();
        resizeHUD();
        
        window.addEventListener('resize', onWindowResize);
        setupControls();

        loadingEl.style.display = 'none';
        animate();
    }

    // --- 3. SHIP MODEL LOADING ---
    function loadShipModel() {
        const loader = new GLTFLoader();
        loader.load('assets/spaceship.glb', (gltf) => {
            const model = gltf.scene;
            model.scale.set(1, 1, 1); 
            
            // FIX: Rotate model 180 degrees so it faces the correct direction
            model.rotation.y = Math.PI; 
            
            shipGroup.add(model);
        }, undefined, (error) => {
            console.warn("Could not load spaceship.glb. Using fallback.");
            const geometry = new THREE.ConeGeometry(2, 10, 8);
            geometry.rotateX(Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color: 0x00aaff, wireframe: true });
            const fallback = new THREE.Mesh(geometry, material);
            
            // FIX: Rotate fallback 180 degrees
            fallback.rotation.y = Math.PI;
            
            shipGroup.add(fallback);
        });
    }

    // --- 4. INFINITE TERRAIN GENERATION ---
    function noise(x, z) {
        const p1 = Math.sin(x * 0.005) * Math.cos(z * 0.005) * 100;
        const p2 = Math.sin(x * 0.02 + 1.3) * Math.cos(z * 0.02 + 2.1) * 30;
        const p3 = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 5;
        return p1 + p2 + p3;
    }

    function generateChunk(cx, cz) {
        const key = `${cx},${cz}`;
        if (chunks.has(key)) return;

        const geometry = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, 24, 24);
        geometry.rotateX(-Math.PI / 2);

        const vertices = geometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i] + (cx * CHUNK_SIZE);
            const z = vertices[i + 2] + (cz * CHUNK_SIZE);
            vertices[i + 1] = noise(x, z);
        }

        geometry.computeVertexNormals();
        const mesh = new THREE.Mesh(geometry, terrainMaterial);
        mesh.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE);
        scene.add(mesh);
        chunks.set(key, mesh);
    }

    function updateTerrain() {
        const playerChunkX = Math.floor(shipGroup.position.x / CHUNK_SIZE);
        const playerChunkZ = Math.floor(shipGroup.position.z / CHUNK_SIZE);

        for (let x = -VIEW_DISTANCE; x <= VIEW_DISTANCE; x++) {
            for (let z = -VIEW_DISTANCE; z <= VIEW_DISTANCE; z++) {
                generateChunk(playerChunkX + x, playerChunkZ + z);
            }
        }

        chunks.forEach((mesh, key) => {
            const [cx, cz] = key.split(',').map(Number);
            if (Math.abs(cx - playerChunkX) > VIEW_DISTANCE + 1 || Math.abs(cz - playerChunkZ) > VIEW_DISTANCE + 1) {
                scene.remove(mesh);
                mesh.geometry.dispose();
                chunks.delete(key);
            }
        });
    }

    // --- 5. CONTROLS ---
    function setupControls() {
        const container = document.getElementById('game-container');

        container.addEventListener('pointerdown', (e) => {
            input.isTouching = true;
            input.startX = e.clientX;
            input.startY = e.clientY;
        });

        container.addEventListener('pointermove', (e) => {
            if (!input.isTouching) return;
            const deltaX = e.clientX - input.startX;
            const deltaY = e.clientY - input.startY;
            
            targetYaw = -(deltaX / (window.innerWidth * 0.4));
            targetPitch = -(deltaY / (window.innerHeight * 0.4));
            
            gameState.throttle = 75 + (targetPitch * 20);
        });

        container.addEventListener('pointerup', () => {
            input.isTouching = false;
            targetYaw = 0;
            targetPitch = 0;
            gameState.throttle = 75;
        });
    }

    // --- 6. HUD RENDERING ---
    function resizeHUD() {
        hudCanvas.width = window.innerWidth;
        hudCanvas.height = window.innerHeight;
    }

    function drawHUD() {
        const w = hudCanvas.width;
        const h = hudCanvas.height;
        const cx = w / 2;
        const cy = h / 2;
        
        hudCtx.clearRect(0, 0, w, h);

        // Cockpit Frame
        hudCtx.fillStyle = 'rgba(5, 8, 12, 0.95)';
        hudCtx.strokeStyle = '#00ffff';
        hudCtx.lineWidth = 2;
        hudCtx.shadowColor = '#00ffff';
        hudCtx.shadowBlur = 10;

        hudCtx.beginPath(); hudCtx.moveTo(0, 0); hudCtx.lineTo(w, 0); hudCtx.lineTo(w * 0.85, h * 0.08); hudCtx.lineTo(w * 0.15, h * 0.08); hudCtx.closePath(); hudCtx.fill(); hudCtx.stroke();
        hudCtx.beginPath(); hudCtx.moveTo(0, 0); hudCtx.lineTo(w * 0.15, h * 0.08); hudCtx.lineTo(w * 0.1, h * 0.8); hudCtx.lineTo(0, h); hudCtx.closePath(); hudCtx.fill(); hudCtx.stroke();
        hudCtx.beginPath(); hudCtx.moveTo(w, 0); hudCtx.lineTo(w * 0.85, h * 0.08); hudCtx.lineTo(w * 0.9, h * 0.8); hudCtx.lineTo(w, h); hudCtx.closePath(); hudCtx.fill(); hudCtx.stroke();
        hudCtx.beginPath(); hudCtx.moveTo(0, h); hudCtx.lineTo(w, h); hudCtx.lineTo(w * 0.9, h * 0.85); hudCtx.lineTo(w * 0.1, h * 0.85); hudCtx.closePath(); hudCtx.fill(); hudCtx.stroke();

        hudCtx.shadowBlur = 0;

        // Center Reticle
        hudCtx.strokeStyle = '#00ffff';
        hudCtx.lineWidth = 1.5;
        hudCtx.beginPath(); hudCtx.arc(cx, cy, 2, 0, Math.PI * 2); hudCtx.fillStyle = '#00ffff'; hudCtx.fill();
        hudCtx.beginPath(); hudCtx.moveTo(cx - 60, cy); hudCtx.lineTo(cx - 20, cy); hudCtx.moveTo(cx + 20, cy); hudCtx.lineTo(cx + 60, cy); hudCtx.moveTo(cx, cy - 60); hudCtx.lineTo(cx, cy - 20); hudCtx.moveTo(cx, cy + 20); hudCtx.lineTo(cx, cy + 60); hudCtx.stroke();

        // Target Reticle
        const tx = cx + Math.cos(Date.now() * 0.0015) * 15;
        const ty = cy - 80 + Math.sin(Date.now() * 0.002) * 10;
        hudCtx.strokeStyle = '#ff6600';
        hudCtx.lineWidth = 2;
        hudCtx.beginPath(); hudCtx.arc(tx, ty, 25, 0, Math.PI * 2); hudCtx.stroke();
        hudCtx.beginPath();
        hudCtx.moveTo(tx - 30, ty - 30); hudCtx.lineTo(tx - 20, ty - 30); hudCtx.lineTo(tx - 20, ty - 20);
        hudCtx.moveTo(tx + 30, ty - 30); hudCtx.lineTo(tx + 20, ty - 30); hudCtx.lineTo(tx + 20, ty - 20);
        hudCtx.moveTo(tx - 30, ty + 30); hudCtx.lineTo(tx - 20, ty + 30); hudCtx.lineTo(tx - 20, ty + 20);
        hudCtx.moveTo(tx + 30, ty + 30); hudCtx.lineTo(tx + 20, ty + 30); hudCtx.lineTo(tx + 20, ty + 20);
        hudCtx.stroke();
        hudCtx.fillStyle = '#ff6600'; hudCtx.font = '12px monospace'; hudCtx.fillText('567m', tx - 15, ty - 35);

        // Left Panel
        hudCtx.fillStyle = '#00ffff'; hudCtx.font = '11px monospace';
        hudCtx.strokeStyle = 'rgba(0, 255, 255, 0.6)'; hudCtx.lineWidth = 1;
        const sx = w * 0.06, sy = h * 0.15;
        hudCtx.beginPath();
        hudCtx.moveTo(sx, sy - 40); hudCtx.lineTo(sx + 15, sy - 10); hudCtx.lineTo(sx + 15, sy + 30); hudCtx.lineTo(sx, sy + 50); hudCtx.lineTo(sx - 15, sy + 30); hudCtx.lineTo(sx - 15, sy - 10); hudCtx.closePath();
        hudCtx.moveTo(sx, sy - 20); hudCtx.lineTo(sx - 40, sy + 10); hudCtx.lineTo(sx - 30, sy + 20); hudCtx.lineTo(sx - 10, sy + 15);
        hudCtx.moveTo(sx, sy - 20); hudCtx.lineTo(sx + 40, sy + 10); hudCtx.lineTo(sx + 30, sy + 20); hudCtx.lineTo(sx + 10, sy + 15);
        hudCtx.stroke();

        hudCtx.fillStyle = '#00ffff';
        hudCtx.fillText('LAT 0.06', w * 0.06, h * 0.32);
        hudCtx.fillText('LNG 7.56', w * 0.06, h * 0.34);
        hudCtx.fillText('VRT 2.50', w * 0.06, h * 0.36);

        hudCtx.fillStyle = '#aaffaa'; hudCtx.fillText('CF-117 Ball Turret', w * 0.06, h * 0.42);
        hudCtx.fillStyle = '#00ffff'; hudCtx.fillText('1600  1600', w * 0.06, h * 0.44);
        hudCtx.fillStyle = '#aaffaa'; hudCtx.fillText('NN-14 Neutron Gun', w * 0.06, h * 0.48);
        hudCtx.fillStyle = '#00ffff'; hudCtx.fillText('87%', w * 0.06, h * 0.50);

        hudCtx.fillText('THR ' + Math.round(gameState.throttle), w * 0.06, h * 0.55);
        hudCtx.fillRect(w * 0.06, h * 0.56, 50, 4);
        hudCtx.fillRect(w * 0.06, h * 0.56, 50 * (gameState.throttle / 100), 4);

        // Right Panel
        hudCtx.fillStyle = '#00ffff'; hudCtx.font = '12px monospace';
        hudCtx.fillText('VANDUUL SCYTHE', w * 0.82, h * 0.25);
        hudCtx.fillStyle = '#aaaaaa'; hudCtx.font = '10px monospace'; hudCtx.fillText('DREAD PIRATE ROBERTS', w * 0.82, h * 0.27);
        hudCtx.fillStyle = '#ff6600'; hudCtx.fillText('1024 m', w * 0.82, h * 0.29);
        
        hudCtx.fillStyle = '#00ffff'; hudCtx.font = '12px monospace'; hudCtx.fillText('VANDUUL SCYTHE', w * 0.82, h * 0.38);
        hudCtx.fillStyle = '#aaaaaa'; hudCtx.font = '10px monospace'; hudCtx.fillText('Pere_Messer_101', w * 0.82, h * 0.40);
        hudCtx.fillStyle = '#ff6600'; hudCtx.fillText('1024 m', w * 0.82, h * 0.42);

        // Radar
        hudCtx.strokeStyle = '#00ffff'; hudCtx.lineWidth = 1.5;
        hudCtx.beginPath(); hudCtx.arc(cx, h * 0.88, 70, 0, Math.PI * 2); hudCtx.stroke();
        hudCtx.beginPath(); hudCtx.arc(cx, h * 0.88, 50, 0, Math.PI * 2); hudCtx.stroke();
        hudCtx.beginPath(); hudCtx.arc(cx, h * 0.88, 30, 0, Math.PI * 2); hudCtx.stroke();

        const sweepAngle = (Date.now() % 3000) / 3000 * Math.PI * 2;
        hudCtx.beginPath(); hudCtx.moveTo(cx, h * 0.88); hudCtx.lineTo(cx + Math.cos(sweepAngle) * 70, h * 0.88 + Math.sin(sweepAngle) * 70); hudCtx.stroke();

        hudCtx.fillStyle = '#ff6600';
        hudCtx.beginPath(); hudCtx.arc(cx + 30, h * 0.88 - 20, 3, 0, Math.PI*2); hudCtx.fill();
        hudCtx.beginPath(); hudCtx.arc(cx - 40, h * 0.88 + 10, 2, 0, Math.PI*2); hudCtx.fill();

        hudCtx.beginPath(); hudCtx.moveTo(cx - 80, h * 0.88); hudCtx.lineTo(cx + 80, h * 0.88); hudCtx.moveTo(cx, h * 0.88 - 80); hudCtx.lineTo(cx, h * 0.88 + 80); hudCtx.stroke();

        // Bottom Left Stats
        hudCtx.fillStyle = '#00ffff'; hudCtx.font = '11px monospace';
        hudCtx.fillText('SPD ' + Math.round(gameState.speed) + ' m/s', w * 0.2, h * 0.95);
        hudCtx.fillText('THR ' + Math.round(gameState.throttle) + '%', w * 0.2, h * 0.97);
        hudCtx.fillRect(w * 0.3, h * 0.96, 40, 4); hudCtx.fillRect(w * 0.35, h * 0.96, 30, 4); hudCtx.fillRect(w * 0.4, h * 0.96, 20, 4);

        // Top Status Bar
        hudCtx.font = '10px monospace';
        hudCtx.fillText('OXYGEN', w * 0.3, h * 0.04); hudCtx.fillText('INTEGRITY', w * 0.45, h * 0.04); hudCtx.fillText('POWER', w * 0.6, h * 0.04);
        hudCtx.fillStyle = '#aaffaa'; hudCtx.fillRect(w * 0.3, h * 0.05, 60, 4);
        hudCtx.fillStyle = '#00ffff'; hudCtx.fillRect(w * 0.45, h * 0.05, 60, 4);
        hudCtx.fillStyle = '#ffcc00'; hudCtx.fillRect(w * 0.6, h * 0.05, 60, 4);
    }

    // --- 7. GAME LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.1);

        // Smooth rotation interpolation
        yaw += (targetYaw - yaw) * 2.0 * delta;
        pitch += (targetPitch - pitch) * 2.0 * delta;
        
        targetRoll = -targetYaw * 0.8;
        roll += (targetRoll - roll) * 1.5 * delta;

        shipGroup.rotation.set(pitch, yaw, roll, 'YXZ');

        gameState.speed = 50 + (gameState.throttle / 100) * 200;
        
        // Move ship forward
        const forward = new THREE.Vector3(0, 0, -1);
        forward.applyQuaternion(shipGroup.quaternion);
        shipGroup.position.addScaledVector(forward, gameState.speed * delta);

        // --- FIX: THIRD PERSON CAMERA LOGIC ---
        // 1. Define a camera offset (Behind and above the ship)
        const cameraOffset = new THREE.Vector3(0, 12, 35); 
        
        // 2. Rotate the offset by the ship's current rotation
        cameraOffset.applyQuaternion(shipGroup.quaternion);
        
        // 3. Calculate the target camera position
        const targetCameraPos = shipGroup.position.clone().add(cameraOffset);
        
        // 4. Smoothly move camera to the target position (lerp for a fluid feel)
        camera.position.lerp(targetCameraPos, 0.15);
        
        // 5. Make the camera look at the ship
        camera.lookAt(shipGroup.position);

        // Update Infinite Terrain
        updateTerrain();

        // Render 3D Scene
        renderer.render(scene, camera);

        // Render 2D HUD
        drawHUD();
    }

    // --- 8. WINDOW RESIZE ---
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        resizeHUD();
    }

    // Start the game
    init();

  </script>
</body>

</html>
