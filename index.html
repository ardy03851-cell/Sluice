<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sense Engine</title>
  <style>
    :root {
      --bg: #0e0e0e;
      --panel: #141414;
      --line: #262626;
      --ink: #e2e2e2;
      --dim: #7c7c7c;
      --accent: #c9c9c9;
      --hi: #ffffff;
      --warn: #d6a44c;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase
    }

    header p {
      margin: 6px 0 0;
      color: var(--dim);
      font-size: 13px;
      max-width: 70ch
    }

    main {
      flex: 1 1 auto;
      display: grid;
      min-height: 0;
      grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.3fr);
    }

    @media (max-width:880px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto
      }
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0
    }

    .panel.left {
      border-right: 1px solid var(--line)
    }

    @media (max-width:880px) {
      .panel.left {
        border-right: none;
        border-bottom: 1px solid var(--line)
      }
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto
    }

    .tabs button {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--dim);
      font: inherit;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 11px 18px;
      cursor: pointer;
    }

    .tabs button.on {
      color: var(--ink);
      border-bottom-color: var(--ink)
    }

    .tabs button:hover {
      color: var(--ink)
    }

    .pad {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1 1 auto;
      min-height: 0
    }

    textarea {
      flex: 1 1 auto;
      min-height: 140px;
      resize: none;
      background: #0a0a0a;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 12px;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
    }

    textarea:focus {
      border-color: #3a3a3a
    }

    #drop {
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 22px 14px;
      text-align: center;
      color: var(--dim);
      font-size: 13px;
      cursor: pointer;
    }

    #drop:hover,
    #drop.over {
      border-color: #3a3a3a;
      color: var(--ink);
      background: #111
    }

    #drop b {
      color: var(--ink);
      font-weight: 500
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    button.act {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 9px 16px;
      font: inherit;
      font-size: 12.5px;
      letter-spacing: .03em;
      cursor: pointer;
    }

    button.act:hover {
      border-color: #4a4a4a;
      background: #181818
    }

    button.act.primary {
      border-color: #4a4a4a;
      color: var(--hi)
    }

    button.act.primary:hover {
      background: #1c1c1c;
      border-color: #666
    }

    label.chk {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--dim);
      font-size: 13px;
      cursor: pointer;
      user-select: none
    }

    label.chk input {
      accent-color: var(--ink)
    }

    label.chk.on {
      color: var(--ink)
    }

    #status {
      font-size: 12.5px;
      color: var(--dim);
      min-height: 18px
    }

    #status b {
      color: var(--ink);
      font-weight: 500
    }

    .out {
      flex: 1 1 auto;
      overflow: auto;
      min-height: 0;
      padding: 18px 20px
    }

    #objView {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #b8b8b8;
    }

    #objView .key {
      color: #e8e8e8
    }

    #objView .str {
      color: #c8c8c8
    }

    #objView .num {
      color: #d6a44c
    }

    #objView .bool {
      color: #d6a44c
    }

    #objView .null {
      color: #d6a44c
    }

    #proseView {
      display: none;
      max-width: 74ch
    }

    #proseView p {
      margin: 0 0 1em
    }

    #proseView .head {
      color: var(--dim);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin: 1.6em 0 .7em;
    }

    #proseView .head:first-child {
      margin-top: 0
    }

    #proseView .sys {
      color: var(--dim);
      font-size: 12.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      margin: 0 0 1.4em;
      line-height: 1.7;
    }

    #proseView .shout {
      color: var(--hi);
      font-weight: 600;
      letter-spacing: .02em;
    }

    #proseView .final {
      border-top: 1px solid var(--line);
      padding-top: 1em;
      margin-top: 1.6em;
      color: var(--ink);
    }

    #proseView blockquote {
      margin: 0 0 1.2em;
      padding-left: 14px;
      border-left: 1px solid var(--line);
      color: var(--dim);
    }

    .empty {
      color: var(--dim);
      font-size: 13px
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px
    }

    ::-webkit-scrollbar-thumb {
      background: #242424
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #303030
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

</head>

<body>

  <header>
    <h1>Sense Engine</h1>
    <p>Turn any text or file into an object, then into prose. Feed it a zip, a receipt, or pure noise — it will say
      something about it anyway.</p>
  </header>

  <main>
    <!-- ============ INPUT ============ -->
    <section class="panel left">
      <div class="tabs">
        <button id="tabText" class="on">Text</button>
        <button id="tabFile">File</button>
      </div>
      <div class="pad">
        <textarea id="textInput" placeholder="Paste anything here. It does not need to be reasonable."></textarea>

        <div id="drop">Drop a <b>.zip</b> here, or any file — or <b>click to browse</b>
          <input type="file" id="fileInput" hidden>
        </div>
        <div class="row" id="fileRow" style="display:none">
          <span id="fileLabel" style="color:var(--dim);font-size:12.5px"></span>
          <button class="act" id="btnClearFile" style="padding:4px 10px;font-size:11.5px">Clear</button>
        </div>

        <div class="row">
          <button class="act primary" id="btnObjectify">Objectify</button>
          <button class="act" id="btnSense">Make Sense</button>
          <button class="act" id="btnNoise">Inject Noise</button>
        </div>
        <div class="row">
          <label class="chk on" id="lblUnhinged">
          <input type="checkbox" id="unhinged" checked> Unhinged mode
        </label>
        </div>
        <div id="status"></div>
      </div>
    </section>

    <!-- ============ OUTPUT ============ -->
    <section class="panel right">
      <div class="tabs">
        <button id="tabObj" class="on">Object</button>
        <button id="tabProse">Prose</button>
      </div>
      <div class="out">
        <pre id="objView" class="empty">No object yet. Press Objectify.</pre>
        <div id="proseView"></div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

/* =========================================================
   0. Utilities
   ========================================================= */
const $ = s => document.querySelector(s);

function fnv1a(bytes){
  let h = 0x811c9dc5;
  for (let i = 0; i < bytes.length; i++){
    h ^= bytes[i];
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hex8 = n => n.toString(16).padStart(8, "0");
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const escapeHTML = s => String(s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* =========================================================
   1. Text -> Object
   ========================================================= */
function textToObject(text){
  const bytes  = new TextEncoder().encode(text);
  const chars  = Array.from(text);

  const wordList = text.toLowerCase().match(/[\p{L}\p{N}'’-]+/gu) || [];
  const freq = Object.create(null);
  for (const w of wordList) freq[w] = (freq[w] || 0) + 1;

  const topWords = Object.entries(freq)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .slice(0, 60);

  const sentences = text
    .split(/(?<=[.!?…])\s+|\n{2,}/u)
    .map(s => s.trim())
    .filter(Boolean);

  const tokens = text.match(/[\p{L}\p{N}'’-]+|[^\s\p{L}\p{N}]/gu) || [];

  const punctuation = Object.create(null);
  for (const ch of chars){
    if (/[^\p{L}\p{N}\s]/u.test(ch)) punctuation[ch] = (punctuation[ch] || 0) + 1;
  }

  const letters = chars.filter(c => /\p{L}/u.test(c)).length;
  const digits  = chars.filter(c => /\p{N}/u.test(c)).length;
  const spaces  = chars.filter(c => /\s/.test(c)).length;

  const longest = wordList.reduce((a, b) => b.length > a.length ? b : a, "");

  return {
    kind: "TEXT_OBJECT",
    id: hex8(fnv1a(bytes)),
    seed: fnv1a(bytes),
    source: "textarea",
    size: { characters: chars.length, bytes: bytes.length },
    composition: {
      letters, digits, whitespace: spaces,
      punctuation: chars.length - letters - digits - spaces,
      uniqueCharacters: new Set(chars).size
    },
    structure: {
      tokens: tokens.length,
      words: wordList.length,
      uniqueWords: Object.keys(freq).length,
      sentences: sentences.length,
      averageSentenceLength: sentences.length
        ? +(wordList.length / sentences.length).toFixed(2) : 0,
      longestWord: longest
    },
    vocabulary: topWords.map(([w, n]) => ({ word: w, count: n })),
    punctuationHistogram: Object.entries(punctuation)
      .sort((a, b) => b[1] - a[1]).slice(0, 20)
      .map(([ch, n]) => ({ mark: ch, count: n })),
    sample: {
      firstSentence: sentences[0] || null,
      lastSentence: sentences.length ? sentences[sentences.length - 1] : null,
      opening: text.slice(0, 120)
    }
  };
}

/* =========================================================
   2. Bytes -> Object (with zip archaeology)
   ========================================================= */
function extractStrings(bytes, min = 4, max = 300){
  const out = [];
  let cur = "";
  for (let i = 0; i < bytes.length; i++){
    const b = bytes[i];
    if (b >= 32 && b < 127) cur += String.fromCharCode(b);
    else { if (cur.length >= min) out.push(cur); cur = ""; }
    if (out.length >= max) break;
  }
  if (cur.length >= min) out.push(cur);
  return out;
}

function detectMagic(b){
  if (b.length < 4) return "too small";
  if (b[0] === 0x50 && b[1] === 0x4b) return "ZIP archive";
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return "PDF document";
  if (b[0] === 0x89 && b[1] === 0x50) return "PNG image";
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return "GIF image";
  if (b[0] === 0xff && b[1] === 0xd8) return "JPEG image";
  if (b[0] === 0x1f && b[1] === 0x8b) return "gzip stream";
  if (b[0] === 0x7f && b[1] === 0x45 && b[2] === 0x4c && b[3] === 0x46) return "ELF binary";
  if (b[0] === 0x4d && b[1] === 0x5a) return "Windows PE";
  if (b[0] === 0x42 && b[1] === 0x4d) return "BMP image";
  if (b[0] === 0x4f && b[1] === 0x67 && b[2] === 0x67) return "Ogg stream";
  if (b[0] === 0x52 && b[1] === 0x61 && b[2] === 0x72) return "RAR archive";
  const sig = Array.from(b.slice(0, 4))
    .map(x => x.toString(16).padStart(2, "0")).join(" ");
  return "unknown (" + sig + ")";
}

async function inflateRaw(bytes){
  if (typeof DecompressionStream === "undefined")
    throw new Error("this browser cannot inflate");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function maybeText(bytes){
  if (!bytes.length || bytes.length > 400000) return null;
  let s;
  try { s = new TextDecoder("utf-8", { fatal: false }).decode(bytes); }
  catch { return null; }
  if (!s.length) return null;
  let printable = 0;
  for (const ch of s){
    const c = ch.codePointAt(0);
    if (c === 9 || c === 10 || c === 13 || (c >= 32 && c < 127) || c > 160) printable++;
  }
  return (printable / s.length) > 0.9 ? s.slice(0, 5000) : null;
}

function looksLikeZip(bytes){
  return bytes.length > 22 && bytes[0] === 0x50 && bytes[1] === 0x4b;
}

async function readZip(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  let eocd = -1;
  const floor = Math.max(0, bytes.length - 22 - 65535);
  for (let i = bytes.length - 22; i >= floor; i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("no end-of-central-directory record");

  const count    = dv.getUint16(eocd + 10, true);
  const cdOffset = dv.getUint32(eocd + 16, true);

  const entries = [];
  let p = cdOffset;

  for (let i = 0; i < count; i++){
    if (p + 46 > bytes.length) break;
    if (dv.getUint32(p, true) !== 0x02014b50) break;

    const method     = dv.getUint16(p + 10, true);
    let   compSize   = dv.getUint32(p + 20, true);
    const uncompSize = dv.getUint32(p + 24, true);
    const nameLen    = dv.getUint16(p + 28, true);
    const extraLen   = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff   = dv.getUint32(p + 42, true);
    const name       = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));

    let text = null, decompressed = false, error = null;

    if (compSize === 0xFFFFFFFF || localOff === 0xFFFFFFFF){
      error = "zip64 entry, skipped";
    } else {
      try {
        const lnameLen  = dv.getUint16(localOff + 26, true);
        const lextraLen = dv.getUint16(localOff + 28, true);
        const dataStart = localOff + 30 + lnameLen + lextraLen;
        const raw = bytes.subarray(dataStart, dataStart + compSize);

        let data = null;
        if (method === 0) data = raw;
        else if (method === 8) { data = await inflateRaw(raw); decompressed = true; }
        else error = "compression method " + method;

        if (data) text = maybeText(data);
      } catch (e) {
        error = String(e.message || e);
      }
    }

    entries.push({
      name,
      method: method === 0 ? "stored" : method === 8 ? "deflate" : "method " + method,
      compressedSize: compSize,
      uncompressedSize: uncompSize,
      decompressed,
      looksLikeText: !!text,
      text: text || undefined,
      note: error || undefined
    });

    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

function bytesToObject(bytes, filename, zipEntries){
  const hist = new Array(256).fill(0);
  for (let i = 0; i < bytes.length; i++) hist[bytes[i]]++;

  let entropy = 0;
  for (const c of hist){
    if (c){
      const pr = c / bytes.length;
      entropy -= pr * Math.log2(pr);
    }
  }
  entropy = +entropy.toFixed(4);

  const strings = extractStrings(bytes);

  const verdict =
    entropy > 7.6 ? "looks like static" :
    entropy > 6.5 ? "structured, unexplained" :
    entropy > 4.0 ? "hiding something readable" :
                    "suspiciously legible";

  const topBytes = hist
    .map((count, byte) => ({ byte, hex: byte.toString(16).padStart(2, "0"), count }))
    .sort((a, b) => b.count - a.count)
    .slice(0, 10);

  const obj = {
    kind: "BINARY_OBJECT",
    id: hex8(fnv1a(bytes)),
    seed: fnv1a(bytes),
    source: filename || "(raw noise)",
    size: bytes.length,
    magic: detectMagic(bytes),
    entropy,
    verdict,
    topBytes,
    byteCoverage: hist.filter(Boolean).length + " / 256 distinct values",
    strings: {
      found: strings.length,
      samples: strings.slice(0, 50)
    }
  };

  if (zipEntries && zipEntries.length){
    obj.archive = {
      entryCount: zipEntries.length,
      entries: zipEntries.slice(0, 60).map(e => ({
        name: e.name,
        method: e.method,
        compressedSize: e.compressedSize,
        uncompressedSize: e.uncompressedSize,
        decompressed: e.decompressed,
        looksLikeText: e.looksLikeText,
        textPreview: e.text ? e.text.slice(0, 400) : undefined,
        note: e.note
      }))
    };
  }

  return obj;
}

/* =========================================================
   3. Object -> Prose
   ========================================================= */

/* -- morphology helpers for regular verbs/nouns -- */
function pluralize(n){
  if (/(s|x|z|ch|sh)$/.test(n)) return n + "es";
  if (/[^aeiou]y$/.test(n))    return n.slice(0, -1) + "ies";
  return n + "s";
}
function thirdPerson(v){
  if (/(s|x|z|ch|sh)$/.test(v)) return v + "es";
  if (/[^aeiou]y$/.test(v))     return v.slice(0, -1) + "ies";
  return v + "s";
}
function pastTense(v){
  if (/e$/.test(v))             return v + "d";
  if (/[^aeiou]y$/.test(v))     return v.slice(0, -1) + "ied";
  return v + "ed";
}

function harvestNames(obj){
  const pool = [];
  const push = s => {
    if (!s) return;
    for (const w of s.match(/[A-Za-z][A-Za-z'’-]{2,13}/g) || []){
      const lw = w.toLowerCase();
      if (STOP.has(lw)) continue;
      if (/^\d+$/.test(w)) continue;
      pool.push(w);
    }
  };

  if (obj.kind === "TEXT_OBJECT"){
    for (const v of obj.vocabulary || []) push(v.word);
  }
  if (obj.strings && obj.strings.samples) obj.strings.samples.forEach(push);
  if (obj.archive){
    for (const e of obj.archive.entries){
      push(e.name);
      if (e.textPreview) push(e.textPreview);
    }
  }

  const seen = new Set();
  const out = [];
  for (let w of pool){
    if (w.length < 3) continue;
    const key = w.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    if (w === w.toLowerCase()) w = w[0].toUpperCase() + w.slice(1);
    out.push(w);
    if (out.length >= 40) break;
  }
  return out;
}

function harvestQuotes(obj){
  const out = [];
  const clean = s => s.replace(/["""]/g, "").replace(/[.;:,]+$/,"").trim();
  const scan = s => {
    if (!s) return;
    for (const piece of String(s).split(/[\n\r\t]+/)){
      const t = clean(piece);
      if (t.length >= 8 && t.length <= 70 && /[a-zA-Z]/.test(t) && !/^[\W_]+$/.test(t)){
        out.push(t);
        if (out.length >= 40) return;
      }
    }
  };
  if (obj.strings && obj.strings.samples) obj.strings.samples.forEach(scan);
  if (obj.archive) obj.archive.entries.forEach(e => scan(e.textPreview));
  if (obj.kind === "TEXT_OBJECT" && obj.sample){
    scan(obj.sample.firstSentence);
    scan(obj.sample.lastSentence);
  }
  return out;
}

  const tpl = TEMPLATES[Math.floor(g.rnd() * TEMPLATES.length)];
  let s = tpl.replace(/\{(\w+)\}/g, (m, k) => (typeof g[k] === "function" ? g[k]() : m));
  s = s.replace(/^([a-z])/, (m, c) => c.toUpperCase());
  return s;
}

/* -- composer -- */
function compose(obj, unhinged, reroll){
  const seed = (obj.seed ^ Math.imul(reroll + 1, 0x9E3779B1)) >>> 0;
  const rnd  = mulberry32(seed);
  const g    = makeGen(rnd, obj);
  const pick = a => a[Math.floor(rnd() * a.length)];

  const buildPara = (n) => {
    const parts = [];
    for (let i = 0; i < n; i++) parts.push(buildSentence(g));
    return parts.join(" ");
  };

  const annotate = () => {
    if (!unhinged) return "";
    const r = rnd();
    if (r < 0.10 && obj.source) return ` — as recorded in ${obj.source}`;
    if (r < 0.17) return ` — byte 0x${Math.floor(rnd()*256).toString(16).padStart(2,"0").toUpperCase()}`;
    if (r < 0.22) return ` — entry ${1 + Math.floor(rnd()*12)} of ${1 + Math.floor(rnd()*40)}`;
    return "";
  };

  const paraWithAnnotations = (n) => {
    const parts = [];
    for (let i = 0; i < n; i++){
      parts.push(buildSentence(g) + (rnd() < 0.14 ? annotate() : ""));
    }
    return parts.join(" ");
  };

  const out = [];
  const P = (cls, text) => out.push({ cls, text });

  /* ---------- binary / archive ---------- */
  if (obj.kind === "BINARY_OBJECT"){
    const isZip = !!obj.archive;

    P("head", unhinged ? "The engine has read your file" : "Reading");
    P("sys",
      `SUBJECT   ${obj.source}\n` +
      `SIZE      ${obj.size.toLocaleString()} bytes\n` +
      `MAGIC     ${obj.magic}\n` +
      `ENTROPY   ${obj.entropy} bits/byte — ${obj.verdict}\n` +
      `DISTINCT  ${obj.byteCoverage}\n` +
      `ID        ${obj.id}`
    );

    if (isZip){
      const n = obj.archive.entryCount;
      P("sys", `It is an archive of ${n} thing${n === 1 ? "" : "s"}, each pretending to be separate from the others.`);
      const names = obj.archive.entries.slice(0, 10).map(e => e.name);
      if (names.length){
        P("sys", "Named: " + names.join("  ·  "));
      }
      const texty = obj.archive.entries.filter(e => e.looksLikeText).length;
      if (texty) P("sys", `${texty} of them contain language. The rest contain intent.`);
    }

    P("head", unhinged ? "What it means" : "Interpretation");
    P("p", paraWithAnnotations(clamp(3 + Math.floor(rnd() * 4), 3, 7)));

    if (unhinged){
      P("p", `<span class="shout">${escapeHTML(pick(CAPS_LINES))}</span>`);
    }

    P("p", paraWithAnnotations(clamp(2 + Math.floor(rnd() * 4), 2, 6)));

    if (obj.archive && obj.archive.entries.length){
      const e = pick(obj.archive.entries);
      const q = e.textPreview
        ? e.textPreview.replace(/\s+/g," ").slice(0, 140)
        : `${pick(LEX.det)} ${pick(LEX.noun)} ${thirdPerson(pick(LEX.verbBase))} ${pick(LEX.adv)}`;
      P("q", `From “${e.name}”: “${q}”`);
    }

    P("head", unhinged ? "What it does not mean" : "Counter-reading");
    P("p", paraWithAnnotations(clamp(2 + Math.floor(rnd() * 3), 2, 5)));

    if (unhinged && rnd() < 0.75){
      P("p", `<span class="shout">${escapeHTML(pick(CAPS_LINES))}</span> ` + escapeHTML(buildSentence(g)));
    }

    P("final", "FINAL DETERMINATION: " + buildSentence(g) + " " + buildSentence(g));
  }

  /* ---------- text ---------- */
  else {
    P("head", unhinged ? "The engine has read your text" : "Reading");
    P("sys",
      `SUBJECT   ${obj.source}\n` +
      `SIZE      ${obj.size.characters.toLocaleString()} characters / ${obj.size.bytes.toLocaleString()} bytes\n` +
      `WORDS     ${obj.structure.words.toLocaleString()} (${obj.structure.uniqueWords.toLocaleString()} distinct)\n` +
      `SENTENCES ${obj.structure.sentences.toLocaleString()}\n` +
      `DENSITY   ${obj.structure.averageSentenceLength} words per sentence\n` +
      `ID        ${obj.id}`
    );

    P("head", unhinged ? "What it means" : "Interpretation");
    P("p", paraWithAnnotations(clamp(3 + Math.floor(rnd() * 4), 3, 7)));

    if (unhinged) P("p", `<span class="shout">${escapeHTML(pick(CAPS_LINES))}</span>`);

    P("p", paraWithAnnotations(clamp(2 + Math.floor(rnd() * 4), 2, 6)));

    if (obj.sample && obj.sample.firstSentence){
      P("q", `It opened with: “${obj.sample.firstSentence.slice(0, 130)}”`);
    }

    P("head", unhinged ? "What it does not mean" : "Counter-reading");
    P("p", paraWithAnnotations(clamp(2 + Math.floor(rnd() * 3), 2, 5)));

    P("final", "FINAL DETERMINATION: " + buildSentence(g) + " " + buildSentence(g));
  }

  return out;
}

/* =========================================================
   4. Rendering
   ========================================================= */
function highlightJSON(json){
  return json
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      m => {
        let cls = "num";
        if (/^"/.test(m)) cls = /:$/.test(m) ? "key" : "str";
        else if (/true|false/.test(m)) cls = "bool";
        else if (/null/.test(m)) cls = "null";
        return `<span class="${cls}">${m}</span>`;
      });
}

function renderObject(obj){
  const el = $("#objView");
  if (!obj){ el.className = "empty"; el.textContent = "No object yet. Press Objectify."; return; }
  el.className = "";
  el.innerHTML = highlightJSON(JSON.stringify(obj, null, 2));
}

function renderProse(blocks){
  const el = $("#proseView");
  el.innerHTML = blocks.map(b => {
    if (b.cls === "head")  return `<div class="head">${escapeHTML(b.text)}</div>`;
    if (b.cls === "sys")   return `<div class="sys">${escapeHTML(b.text)}</div>`;
    if (b.cls === "q")     return `<blockquote>${escapeHTML(b.text)}</blockquote>`;
    if (b.cls === "final") return `<p class="final">${escapeHTML(b.text)}</p>`;
    return `<p>${b.text}</p>`;
  }).join("");
}

function setView(v){
  const objOn = v === "obj";
  $("#tabObj").classList.toggle("on", objOn);
  $("#tabProse").classList.toggle("on", !objOn);
  $("#objView").style.display = objOn ? "block" : "none";
  $("#proseView").style.display = objOn ? "none" : "block";
}

function status(html){ $("#status").innerHTML = html; }

/* =========================================================
   5. Wiring
   ========================================================= */
const state = { file: null, object: null, reroll: 0 };

const textInput = $("#textInput");
const drop      = $("#drop");
const fileInput = $("#fileInput");

/* input tabs */
$("#tabText").onclick = () => {
  $("#tabText").classList.add("on"); $("#tabFile").classList.remove("on");
  textInput.style.display = "block"; drop.style.display = "none";
  $("#fileRow").style.display = "none";
};
$("#tabFile").onclick = () => {
  $("#tabFile").classList.add("on"); $("#tabText").classList.remove("on");
  textInput.style.display = "none"; drop.style.display = "block";
  if (state.file) $("#fileRow").style.display = "flex";
};

/* output tabs */
$("#tabObj").onclick   = () => setView("obj");
$("#tabProse").onclick = () => setView("prose");

/* unhinged toggle */
$("#unhinged").onchange = e => {
  $("#lblUnhinged").classList.toggle("on", e.target.checked);
  if (state.object) sense();
};

/* file handling */
drop.onclick = () => fileInput.click();
fileInput.onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };

["dragenter","dragover"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

const MAX_BYTES = 16 * 1024 * 1024;

async function loadFile(file){
  state.file = file;
  $("#fileLabel").textContent = file.name + "  (" + file.size.toLocaleString() + " bytes)";
  $("#fileRow").style.display = "flex";
  $("#tabFile").click();
  status("Loaded <b>" + escapeHTML(file.name) + "</b>");
  await objectify();
}

$("#btnClearFile").onclick = () => {
  state.file = null;
  fileInput.value = "";
  $("#fileRow").style.display = "none";
  status("File cleared.");
};

/* objectify */
async function objectify(){
  try {
    if (state.file){
      status("Reading bytes…");
      let bytes = new Uint8Array(await state.file.arrayBuffer());
      let truncated = false;
      if (bytes.length > MAX_BYTES){
        bytes = bytes.slice(0, MAX_BYTES);
        truncated = true;
      }

      let entries = [];
      if (looksLikeZip(bytes)){
        status("Archive detected — opening it…");
        try { entries = await readZip(bytes); }
        catch (e){ entries = []; status("Zip parse failed: " + escapeHTML(String(e.message||e))); }
      }

      state.object = bytesToObject(bytes, state.file.name, entries);
      if (truncated) state.object.note = "truncated to first 16 MB";
      renderObject(state.object);
      status("Object built: <b>" + state.object.id + "</b> · entropy " + state.object.entropy);
      sense();
    } else {
      const text = textInput.value;
      if (!text.trim()){ status("There is nothing to objectify."); return; }
      state.object = textToObject(text);
      renderObject(state.object);
      status("Object built: <b>" + state.object.id + "</b> · " +
             state.object.structure.words.toLocaleString() + " words");
      sense();
    }
  } catch (e){
    status("Failure: " + escapeHTML(String(e.message || e)));
  }
}

/* make sense */
function sense(){
  if (!state.object){ status("Build an object first."); return; }
  const blocks = compose(state.object, $("#unhinged").checked, state.reroll++);
  renderProse(blocks);
  setView("prose");
  status("Sense made. Press Make Sense again to re-roll.");
}

/* inject noise */
$("#btnNoise").onclick = async () => {
  const n = 4096;
  const bytes = new Uint8Array(n);
  crypto.getRandomValues(bytes);
  state.file = null;
  state.object = bytesToObject(bytes, "(fresh noise)", []);
  renderObject(state.object);
  setView("obj");
  status("Injected " + n + " bytes of pure noise. Entropy " + state.object.entropy);
  sense();
};

/* buttons */
$("#btnObjectify").onclick = objectify;
$("#btnSense").onclick = sense;

/* keyboard shortcut */
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); objectify(); }
});

/* boot */
setView("obj");
status("Ready. Paste text, drop a file, or inject noise.");
  </script>
</body>
