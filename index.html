<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spaceship Flight Sim</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            touch-action: none; /* Prevents iPad scrolling/zooming */
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #hud-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through to the game */
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-family: monospace;
            font-size: 24px;
            z-index: 3;
        }
    </style>
    <!-- Import Three.js and GLTFLoader -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="game-container">
    <div id="loading">INITIALIZING SYSTEMS...</div>
    <canvas id="webgl-canvas"></canvas>
    <canvas id="hud-canvas"></canvas>
</div>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- 1. SETUP & VARIABLES ---
    const webglCanvas = document.getElementById('webgl-canvas');
    const hudCanvas = document.getElementById('hud-canvas');
    const hudCtx = hudCanvas.getContext('2d');
    const loadingEl = document.getElementById('loading');

    let scene, camera, renderer, clock;
    let shipGroup;
    let shipSpeed = 0;
    const maxSpeed = 500;
    
    // Flight physics variables
    let pitch = 0;
    let yaw = 0;
    let roll = 0;
    const pitchSpeed = 1.5;
    const yawSpeed = 1.5;
    const rollSpeed = 2.0;

    // Input state
    const input = { x: 0, y: 0, isTouching: false, touchStartX: 0, touchStartY: 0 };

    // Terrain variables
    const CHUNK_SIZE = 2000;
    const VIEW_DISTANCE = 3; // How many chunks to render in each direction
    const chunks = new Map();
    let terrainMaterial;

    // --- 2. TERRAIN NOISE (Simple Perlin-like for infinite terrain) ---
    // A simplified pseudo-random noise function for terrain height
    function noise(x, z) {
        const p = Math.sin(x * 0.01) * Math.cos(z * 0.01);
        const p2 = Math.sin(x * 0.05 + 1.3) * Math.cos(z * 0.05 + 2.1) * 0.5;
        const p3 = Math.sin(x * 0.002) * Math.cos(z * 0.002) * 5;
        return (p + p2 + p3) * 20; // Scale height
    }

    // --- 3. INITIALIZATION ---
    function init() {
        // Setup Three.js
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050a15, 0.0003); // Space-like fog

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        
        renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimize for iPad retina

        clock = new THREE.Clock();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x334455, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(1000, 2000, 500);
        scene.add(dirLight);

        // Setup Ship Group
        shipGroup = new THREE.Group();
        scene.add(shipGroup);
        
        // Position ship slightly above origin
        shipGroup.position.set(0, 200, 0);

        // Setup Terrain Material (Low poly, flat shading)
        terrainMaterial = new THREE.MeshStandardMaterial({
            color: 0x223344,
            wireframe: false,
            flatShading: true,
            roughness: 0.8,
            metalness: 0.2
        });

        // Load Ship Model
        loadShipModel();

        // Setup HUD
        resizeHUD();
        
        // Event Listeners
        window.addEventListener('resize', onWindowResize);
        setupControls();

        // Remove loading screen
        loadingEl.style.display = 'none';

        // Start Game Loop
        animate();
    }

    // --- 4. SHIP MODEL LOADING ---
    function loadShipModel() {
        const loader = new GLTFLoader();
        
        // NOTE: Browsers cannot load .blend files. You must export to .glb from Blender.
        // Make sure spaceship.glb is in the assets folder.
        loader.load('assets/spaceship.glb', (gltf) => {
            const model = gltf.scene;
            
            // Adjust scale if necessary based on your Blender export
            model.scale.set(1, 1, 1); 
            
            // Add to ship group
            shipGroup.add(model);
            
            // Since it's a cockpit view, we might want to position the camera inside
            // For now, we'll assume the model is centered and the camera is at the origin of the group
            // If the model blocks the view, you may need to adjust its position here:
            // model.position.z = -5; 
            
            // Apply texture if it didn't load from glb
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('assets/spaceshiptexture.png', (texture) => {
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.material.map = texture;
                        child.material.needsUpdate = true;
                    }
                });
            });

        }, undefined, (error) => {
            console.warn("Could not load spaceship.glb. Make sure you exported your .blend to .glb and placed it in the assets folder. Using fallback ship.");
            createFallbackShip();
        });
    }

    function createFallbackShip() {
        // Create a simple placeholder if the model is missing
        const geometry = new THREE.ConeGeometry(2, 10, 8);
        geometry.rotateX(Math.PI / 2);
        const material = new THREE.MeshStandardMaterial({ color: 0x00aaff, wireframe: true });
        const fallback = new THREE.Mesh(geometry, material);
        fallback.position.z = -5; // Push forward so we see it in front of camera
        shipGroup.add(fallback);
    }

    // --- 5. INFINITE TERRAIN GENERATION ---
    function generateChunk(cx, cz) {
        const key = `${cx},${cz}`;
        if (chunks.has(key)) return;

        const geometry = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, 20, 20);
        geometry.rotateX(-Math.PI / 2);

        const vertices = geometry.attributes.position.array;
        
        // Displace vertices based on noise
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i] + (cx * CHUNK_SIZE);
            const z = vertices[i + 2] + (cz * CHUNK_SIZE);
            
            // Base terrain height
            let y = noise(x, z);
            
            // Add some craters or mountains
            y += Math.abs(noise(x * 0.5, z * 0.5)) * 50;
            
            vertices[i + 1] = y;
        }

        geometry.computeVertexNormals();

        const mesh = new THREE.Mesh(geometry, terrainMaterial);
        mesh.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE);
        
        scene.add(mesh);
        chunks.set(key, mesh);
    }

    function updateTerrain() {
        const playerChunkX = Math.floor(shipGroup.position.x / CHUNK_SIZE);
        const playerChunkZ = Math.floor(shipGroup.position.z / CHUNK_SIZE);

        // Generate new chunks around player
        for (let x = -VIEW_DISTANCE; x <= VIEW_DISTANCE; x++) {
            for (let z = -VIEW_DISTANCE; z <= VIEW_DISTANCE; z++) {
                generateChunk(playerChunkX + x, playerChunkZ + z);
            }
        }

        // Remove distant chunks to save memory
        const toRemove = [];
        chunks.forEach((mesh, key) => {
            const [cx, cz] = key.split(',').map(Number);
            if (Math.abs(cx - playerChunkX) > VIEW_DISTANCE + 1 || 
                Math.abs(cz - playerChunkZ) > VIEW_DISTANCE + 1) {
                toRemove.push(key);
            }
        });

        toRemove.forEach(key => {
            const mesh = chunks.get(key);
            scene.remove(mesh);
            mesh.geometry.dispose();
            chunks.delete(key);
        });
    }

    // --- 6. CONTROLS (IPAD OPTIMIZED) ---
    function setupControls() {
        const container = document.getElementById('game-container');

        container.addEventListener('pointerdown', (e) => {
            input.isTouching = true;
            input.touchStartX = e.clientX;
            input.touchStartY = e.clientY;
        });

        container.addEventListener('pointermove', (e) => {
            if (!input.isTouching) return;
            
            const deltaX = e.clientX - input.touchStartX;
            const deltaY = e.clientY - input.touchStartY;
            
            // Normalize input
            input.x = deltaX / (window.innerWidth * 0.3);
            input.y = deltaY / (window.innerHeight * 0.3);
            
            // Clamp
            input.x = Math.max(-1, Math.min(1, input.x));
            input.y = Math.max(-1, Math.min(1, input.y));
        });

        container.addEventListener('pointerup', () => {
            input.isTouching = false;
            input.x = 0;
            input.y = 0;
        });
        
        container.addEventListener('pointercancel', () => {
            input.isTouching = false;
            input.x = 0;
            input.y = 0;
        });
        
        // Auto-throttle forward for simplicity (can be changed later)
        shipSpeed = 100; 
    }

    // --- 7. HUD RENDERING (Canvas 2D overlay matching the reference) ---
    function resizeHUD() {
        hudCanvas.width = window.innerWidth;
        hudCanvas.height = window.innerHeight;
    }

    function drawHUD() {
        const w = hudCanvas.width;
        const h = hudCanvas.height;
        
        hudCtx.clearRect(0, 0, w, h);

        // --- 1. Cockpit Frame (Dark angular overlays on edges) ---
        hudCtx.fillStyle = 'rgba(5, 10, 15, 0.95)';
        hudCtx.strokeStyle = '#00ffff';
        hudCtx.lineWidth = 2;

        // Top frame
        hudCtx.beginPath();
        hudCtx.moveTo(0, 0);
        hudCtx.lineTo(w, 0);
        hudCtx.lineTo(w, h * 0.1);
        hudCtx.lineTo(w * 0.8, h * 0.05);
        hudCtx.lineTo(w * 0.2, h * 0.05);
        hudCtx.lineTo(0, h * 0.1);
        hudCtx.closePath();
        hudCtx.fill();
        hudCtx.stroke();

        // Left frame
        hudCtx.beginPath();
        hudCtx.moveTo(0, 0);
        hudCtx.lineTo(w * 0.15, h * 0.15);
        hudCtx.lineTo(w * 0.1, h * 0.8);
        hudCtx.lineTo(0, h);
        hudCtx.closePath();
        hudCtx.fill();
        hudCtx.stroke();

        // Right frame
        hudCtx.beginPath();
        hudCtx.moveTo(w, 0);
        hudCtx.lineTo(w * 0.85, h * 0.15);
        hudCtx.lineTo(w * 0.9, h * 0.8);
        hudCtx.lineTo(w, h);
        hudCtx.closePath();
        hudCtx.fill();
        hudCtx.stroke();

        // Bottom frame
        hudCtx.beginPath();
        hudCtx.moveTo(0, h);
        hudCtx.lineTo(w, h);
        hudCtx.lineTo(w * 0.9, h * 0.85);
        hudCtx.lineTo(w * 0.1, h * 0.85);
        hudCtx.closePath();
        hudCtx.fill();
        hudCtx.stroke();

        // --- 2. Center Crosshair & Target ---
        const cx = w / 2;
        const cy = h / 2;

        hudCtx.strokeStyle = '#00ffff';
        hudCtx.lineWidth = 1.5;
        
        // Center dot
        hudCtx.beginPath();
        hudCtx.arc(cx, cy, 3, 0, Math.PI * 2);
        hudCtx.fillStyle = '#00ffff';
        hudCtx.fill();

        // Crosshair brackets
        hudCtx.beginPath();
        hudCtx.moveTo(cx - 40, cy); hudCtx.lineTo(cx - 15, cy);
        hudCtx.moveTo(cx + 15, cy); hudCtx.lineTo(cx + 40, cy);
        hudCtx.moveTo(cx, cy - 40); hudCtx.lineTo(cx, cy - 15);
        hudCtx.moveTo(cx, cy + 15); hudCtx.lineTo(cx, cy + 40);
        hudCtx.stroke();

        // Orange Target Reticle (Simulated)
        hudCtx.strokeStyle = '#ff6600';
        hudCtx.lineWidth = 2;
        hudCtx.beginPath();
        hudCtx.arc(cx, cy - 50, 30, 0, Math.PI * 2); // Circle
        hudCtx.stroke();
        
        // Target corners
        hudCtx.beginPath();
        hudCtx.moveTo(cx - 35, cy - 85); hudCtx.lineTo(cx - 25, cy - 85); hudCtx.lineTo(cx - 25, cy - 75);
        hudCtx.moveTo(cx + 35, cy - 85); hudCtx.lineTo(cx + 25, cy - 85); hudCtx.lineTo(cx + 25, cy - 75);
        hudCtx.moveTo(cx - 35, cy - 15); hudCtx.lineTo(cx - 25, cy - 15); hudCtx.lineTo(cx - 25, cy - 25);
        hudCtx.moveTo(cx + 35, cy - 15); hudCtx.lineTo(cx + 25, cy - 15); hudCtx.lineTo(cx + 25, cy - 25);
        hudCtx.stroke();

        // Target distance text
        hudCtx.fillStyle = '#ff6600';
        hudCtx.font = '14px monospace';
        hudCtx.fillText('567m', cx - 20, cy - 85);

        // --- 3. Left Panel (Ship Status) ---
        hudCtx.fillStyle = '#00ffff';
        hudCtx.font = '12px monospace';
        
        // Wireframe placeholder
        hudCtx.strokeStyle = '#00ffff';
        hudCtx.lineWidth = 1;
        hudCtx.beginPath();
        hudCtx.moveTo(w * 0.05, h * 0.15);
        hudCtx.lineTo(w * 0.12, h * 0.12);
        hudCtx.lineTo(w * 0.15, h * 0.2);
        hudCtx.lineTo(w * 0.08, h * 0.25);
        hudCtx.closePath();
        hudCtx.stroke();

        // Speed text
        hudCtx.fillText('SPD: ' + Math.floor(shipSpeed) + ' m/s', w * 0.05, h * 0.4);
        
        // Weapon status
        hudCtx.fillStyle = '#aaffaa';
        hudCtx.fillText('CF-117 Ball Turret', w * 0.05, h * 0.45);
        hudCtx.fillText('NN-14 Neutron Gun', w * 0.05, h * 0.5);
        hudCtx.fillStyle = '#00ffff';
        hudCtx.fillText('87%', w * 0.05, h * 0.52);

        // --- 4. Right Panel (Targets) ---
        hudCtx.fillStyle = '#00ffff';
        hudCtx.fillText('VANDUUL SCYTHE', w * 0.85, h * 0.3);
        hudCtx.fillText('DREAD PIRATE ROBERTS', w * 0.85, h * 0.33);
        
        hudCtx.fillStyle = '#ff6600';
        hudCtx.fillText('1024 m', w * 0.85, h * 0.36);
        
        hudCtx.fillStyle = '#00ffff';
        hudCtx.fillText('VANDUUL SCYTHE', w * 0.85, h * 0.45);
        hudCtx.fillText('Pere_Messer_101', w * 0.85, h * 0.48);
        hudCtx.fillText('1024 m', w * 0.85, h * 0.51);

        // --- 5. Bottom Center (Radar & Graphs) ---
        // Radar Circle
        hudCtx.strokeStyle = '#00ffff';
        hudCtx.lineWidth = 2;
        hudCtx.beginPath();
        hudCtx.arc(cx, h * 0.85, 60, 0, Math.PI * 2);
        hudCtx.stroke();

        // Radar inner rings
        hudCtx.beginPath();
        hudCtx.arc(cx, h * 0.85, 40, 0, Math.PI * 2);
        hudCtx.stroke();
        hudCtx.beginPath();
        hudCtx.arc(cx, h * 0.85, 20, 0, Math.PI * 2);
        hudCtx.stroke();

        // Radar sweep line (animated)
        const sweepAngle = (Date.now() % 2000) / 2000 * Math.PI * 2;
        hudCtx.beginPath();
        hudCtx.moveTo(cx, h * 0.85);
        hudCtx.lineTo(cx + Math.cos(sweepAngle) * 60, h * 0.85 + Math.sin(sweepAngle) * 60);
        hudCtx.stroke();

        // Radar blips
        hudCtx.fillStyle = '#ff6600';
        hudCtx.beginPath();
        hudCtx.arc(cx + 20, h * 0.85 - 15, 3, 0, Math.PI * 2);
        hudCtx.fill();

        // Speed Graph (Bottom Left)
        hudCtx.strokeStyle = '#00ffff';
        hudCtx.beginPath();
        hudCtx.moveTo(w * 0.2, h * 0.9);
        hudCtx.lineTo(w * 0.3, h * 0.9);
        hudCtx.stroke();
        hudCtx.fillStyle = '#00ffff';
        hudCtx.fillText('THR 90', w * 0.2, h * 0.88);
    }

    // --- 8. GAME LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        // Apply input to rotation (Flight Physics)
        if (input.isTouching || input.x !== 0 || input.y !== 0) {
            // Yaw (Left/Right)
            yaw -= input.x * yawSpeed * delta;
            // Pitch (Up/Down)
            pitch -= input.y * pitchSpeed * delta;
        }

        // Auto-level roll (Banking)
        const targetRoll = -input.x * 0.8;
        roll += (targetRoll - roll) * 2.0 * delta;

        // Apply rotations to ship group
        shipGroup.rotation.set(pitch, yaw, roll, 'YXZ');

        // Move ship forward in the direction it's facing
        const forward = new THREE.Vector3(0, 0, -1);
        forward.applyQuaternion(shipGroup.quaternion);
        shipGroup.position.addScaledVector(forward, shipSpeed * delta);

        // Camera follows ship (first person cockpit view)
        camera.position.copy(shipGroup.position);
        camera.quaternion.copy(shipGroup.quaternion);

        // Update Infinite Terrain
        updateTerrain();

        // Render 3D Scene
        renderer.render(scene, camera);

        // Render 2D HUD
        drawHUD();
    }

    // --- 9. WINDOW RESIZE ---
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        resizeHUD();
    }

    // Start the game
    init();

</script>
</body>
</html>
